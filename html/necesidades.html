<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6ef">
  <title>Elige tus necesidades — CuidaMe</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="public-header">
    <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">♡</span><span class="brand-name">Cuida<span>Me</span><small>Tu apoyo, siempre contigo</small></span></a>
    <a class="text-link" href="perfil.html">← Cambiar perfil</a>
  </header>
  <main id="contenido" class="screen-page">
    <div class="flow-progress"><span class="progress-current">PASO 2 DE 3</span><span>Elige lo que te interesa</span></div>
    <section class="flow-heading">
      <p class="eyebrow">APOYOS PARA TU DÍA A DÍA</p>
      <h1>¿Qué necesidades tienes?</h1>
      <p class="screen-intro">Puedes marcar varias opciones. No se guarda ninguna selección fuera de esta página.</p>
    </section>
    <div class="needs-grid">
      <label class="need-option"><input type="checkbox"><span class="need-symbol" aria-hidden="true">♿</span><strong>Transporte adaptado</strong><small>Desplazamientos y accesos.</small></label>
      <label class="need-option"><input type="checkbox"><span class="need-symbol" aria-hidden="true">♡</span><strong>Aseo y vestido</strong><small>Apoyo en actividades personales.</small></label>
      <label class="need-option"><input type="checkbox"><span class="need-symbol" aria-hidden="true">✿</span><strong>Alimentación</strong><small>Comidas y preparación.</small></label>
      <label class="need-option"><input type="checkbox"><span class="need-symbol" aria-hidden="true">⌂</span><strong>Limpieza del hogar</strong><small>Organizar las tareas de casa.</small></label>
    </div>
    <div class="screen-actions"><a class="button button-quiet" href="perfil.html">Atrás</a><a class="button button-primary" href="apoyos.html">Guardar y continuar <span aria-hidden="true">→</span></a></div>
  </main>
  <script src="../js/script.js" defer></script>
