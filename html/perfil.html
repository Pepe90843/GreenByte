<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6ef">
  <title>¿Para quién es la ayuda? — CuidaMe</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="public-header">
    <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">♡</span><span class="brand-name">Cuida<span>Me</span><small>Tu apoyo, siempre contigo</small></span></a>
    <a class="text-link" href="../index.html">← Volver</a>
  </header>
  <main id="contenido" class="screen-page">
    <div class="flow-progress"><span class="progress-current">PASO 1 DE 3</span><span>Personaliza tu experiencia</span></div>
    <section class="flow-heading">
      <p class="eyebrow">EMPECEMOS POR TI</p>
      <h1>¿Para quién es la ayuda?</h1>
      <p class="screen-intro">Elige la opción que mejor te representa. Esta elección solo sirve para recorrer el prototipo.</p>
    </section>
    <fieldset class="profile-options">
      <legend class="sr-only">Selecciona a quién va dirigido el apoyo</legend>
        <label class="profile-option is-selected">
          <input type="radio" name="perfil" value="Para mí" checked>
          <span class="profile-option-icon" aria-hidden="true">☺</span>
          <strong>Para mí</strong>
          <span>Quiero explorar apoyos para mi día a día.</span>
        </label>
        <label class="profile-option">
          <input type="radio" name="perfil" value="Para un familiar">
          <span class="profile-option-icon" aria-hidden="true">♡</span>
          <strong>Para un familiar</strong>
          <span>Quiero organizar el cuidado de alguien cercano.</span>
        </label>
        <label class="profile-option">
          <input type="radio" name="perfil" value="Como profesional">
          <span class="profile-option-icon" aria-hidden="true">✳</span>
          <strong>Como profesional</strong>
          <span>Quiero conocer recursos para las personas a las que apoyo.</span>
        </label>
    </fieldset>
    <div class="screen-actions"><a class="button button-quiet" href="../index.html">Volver</a><a class="button button-primary" href="necesidades.html">Continuar <span aria-hidden="true">→</span></a></div>
  </main>
  <script src="../js/script.js" defer></script>
</body>
</html>
